<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="1200" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="primary-btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-20" y="-10" width="1240" height="715" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow-card" x="-10" y="-5" width="600" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace; }
    </style>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Radial Glow Accents -->
  <circle cx="200" cy="150" r="300" fill="url(#cyan-glow)"/>
  <circle cx="1050" cy="120" r="280" fill="url(#blue-glow)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <path d="M0 75h1200M0 150h1200M0 225h1200M0 300h1200M0 375h1200M0 450h1200M0 525h1200M0 600h1200" stroke="#1e293b" stroke-opacity="0.25" stroke-dasharray="2 4"/>
  <path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675" stroke="#1e293b" stroke-opacity="0.25" stroke-dasharray="2 4"/>

  <!-- MAIN APP WINDOW CONTAINER -->
  <g filter="url(#shadow-main)">
    <!-- Window Frame -->
    <rect x="50" y="35" width="1100" height="605" rx="14" fill="#0d131f" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <path d="M50 49a14 14 0 0 1 14-14h1072a14 14 0 0 1 14 14v41H50z" fill="#111827"/>
    <line x1="50" y1="90" x2="1150" y2="90" stroke="#1f2937" stroke-width="1"/>

    <!-- Window Dots (macOS style) -->
    <circle cx="78" cy="62" r="6" fill="#ef4444"/>
    <circle cx="98" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="118" cy="62" r="6" fill="#10b981"/>

    <!-- App Brand & Title -->
    <g transform="translate(145, 52)">
      <rect width="20" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <path d="M11 6L8 11h3l-1 4 4-5h-3l2-4z" fill="#22d3ee"/>
      <text x="28" y="15" fill="#ffffff" font-weight="700" font-size="13" class="font-sans" letter-spacing="0.5">PrefixList</text>
      <text x="96" y="15" fill="#64748b" font-size="12" class="font-sans">⚡ MikroTik RouterOS v7 Prefix Kit &amp; Address List Automation</text>
    </g>

    <!-- Top Right Nav Tabs -->
    <g transform="translate(860, 48)">
      <rect x="0" y="2" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="18" fill="#38bdf8" font-size="11" font-weight="600" class="font-sans">Catalog</text>
      <text x="92" y="18" fill="#94a3b8" font-size="11" class="font-sans">PBR Setup</text>
      <text x="165" y="18" fill="#94a3b8" font-size="11" class="font-sans">Scheduler</text>
      <text x="235" y="18" fill="#94a3b8" font-size="11" class="font-sans">Docs</text>
    </g>

    <!-- ============================================== -->
    <!-- CONTENT AREA -->
    <!-- ============================================== -->

    <!-- METRICS STRIP -->
    <g transform="translate(75, 110)">
      <rect width="1050" height="62" rx="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>

      <!-- Metric 1 -->
      <text x="25" y="25" fill="#64748b" font-size="11" class="font-sans">Curated Organizations</text>
      <text x="25" y="47" fill="#ffffff" font-size="17" font-weight="700" class="font-mono">25 Networks</text>
      <text x="135" y="47" fill="#06b6d4" font-size="10" class="font-sans">BGP / ASN</text>

      <line x1="220" y1="12" x2="220" y2="50" stroke="#1e293b" stroke-width="1"/>

      <!-- Metric 2 -->
      <text x="245" y="25" fill="#64748b" font-size="11" class="font-sans">Country Geo-IP Zones</text>
      <text x="245" y="47" fill="#ffffff" font-size="17" font-weight="700" class="font-mono">23 Countries</text>
      <text x="365" y="47" fill="#3b82f6" font-size="10" class="font-sans">ISO Blocks</text>

      <line x1="440" y1="12" x2="440" y2="50" stroke="#1e293b" stroke-width="1"/>

      <!-- Metric 3 -->
      <text x="465" y="25" fill="#64748b" font-size="11" class="font-sans">CIDR Aggregation Engine</text>
      <text x="465" y="47" fill="#10b981" font-size="17" font-weight="700" class="font-mono">Optimized &amp; Collapsed</text>
      <text x="680" y="47" fill="#64748b" font-size="10" class="font-sans">-35% RAM Bloat</text>

      <line x1="780" y1="12" x2="780" y2="50" stroke="#1e293b" stroke-width="1"/>

      <!-- Metric 4 -->
      <text x="805" y="25" fill="#64748b" font-size="11" class="font-sans">RouterOS Target</text>
      <text x="805" y="47" fill="#38bdf8" font-size="17" font-weight="700" class="font-mono">v7 (FIB) &amp; v6</text>
      <text x="940" y="47" fill="#10b981" font-size="10" class="font-sans">100% Idempotent</text>
    </g>

    <!-- LEFT COLUMN: CATALOG LIST (width: 510) -->
    <g transform="translate(75, 190)">
      <!-- Search & Filters -->
      <rect width="510" height="38" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" stroke="#64748b" stroke-width="1.5"/>
      <line x1="24.5" y1="23.5" x2="30" y2="29" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <text x="40" y="23" fill="#94a3b8" font-size="12" class="font-sans">Search ISP, ASN (e.g. AS13335), country code...</text>

      <!-- Category Badges -->
      <rect x="360" y="7" width="46" height="24" rx="5" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8"/>
      <text x="372" y="23" fill="#38bdf8" font-size="11" font-weight="600" class="font-sans">All</text>
      <rect x="412" y="7" width="42" height="24" rx="5" fill="#1e293b"/>
      <text x="420" y="23" fill="#64748b" font-size="11" class="font-sans">Org</text>
      <rect x="458" y="7" width="46" height="24" rx="5" fill="#1e293b"/>
      <text x="466" y="23" fill="#64748b" font-size="11" class="font-sans">Geo</text>

      <!-- ITEM 1: CLOUDFLARE (Active Selection) -->
      <g transform="translate(0, 52)">
        <rect width="510" height="84" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
        <!-- Orange Cloudflare Icon Badge -->
        <rect x="16" y="18" width="46" height="46" rx="8" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/>
        <text x="24" y="47" fill="#fb923c" font-size="20">☁️</text>

        <!-- Details -->
        <text x="74" y="34" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">Cloudflare</text>
        <rect x="156" y="22" width="62" height="18" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
        <text x="163" y="35" fill="#22d3ee" font-size="10" font-weight="600" class="font-mono">AS13335</text>
        <text x="228" y="35" fill="#64748b" font-size="11" class="font-sans">Anycast CDN &amp; DNS</text>

        <!-- Stats row -->
        <text x="74" y="56" fill="#94a3b8" font-size="11" class="font-mono">IPv4: <tspan fill="#38bdf8">14 CIDRs</tspan> · IPv6: <tspan fill="#38bdf8">7 CIDRs</tspan> · Overlaps: <tspan fill="#10b981">Collapsed</tspan></text>

        <!-- Quick copy button -->
        <rect x="415" y="26" width="80" height="30" rx="6" fill="#0891b2" fill-opacity="0.25" stroke="#0891b2" stroke-width="1"/>
        <text x="430" y="45" fill="#22d3ee" font-size="11" font-weight="600" class="font-sans">Selected ✓</text>
      </g>

      <!-- ITEM 2: GOOGLE -->
      <g transform="translate(0, 148)">
        <rect width="510" height="74" rx="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
        <rect x="16" y="14" width="46" height="46" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="26" y="43" fill="#60a5fa" font-size="18">🌐</text>
        <text x="74" y="32" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Google Services &amp; YouTube</text>
        <rect x="250" y="20" width="58" height="18" rx="4" fill="#1e293b"/>
        <text x="256" y="33" fill="#94a3b8" font-size="10" class="font-mono">AS15169</text>
        <text x="74" y="52" fill="#64748b" font-size="11" class="font-mono">IPv4: 184 CIDRs · IPv6: 12 CIDRs</text>
        <rect x="425" y="22" width="70" height="28" rx="6" fill="#1e293b"/>
        <text x="440" y="40" fill="#cbd5e1" font-size="11" class="font-sans">Copy RSC</text>
      </g>

      <!-- ITEM 3: AMAZON AWS -->
      <g transform="translate(0, 234)">
        <rect width="510" height="74" rx="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
        <rect x="16" y="14" width="46" height="46" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="26" y="43" fill="#fbbf24" font-size="18">📦</text>
        <text x="74" y="32" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Amazon AWS Global Cloud</text>
        <rect x="255" y="20" width="58" height="18" rx="4" fill="#1e293b"/>
        <text x="261" y="33" fill="#94a3b8" font-size="10" class="font-mono">AS16509</text>
        <text x="74" y="52" fill="#64748b" font-size="11" class="font-mono">IPv4: 420 CIDRs · IPv6: 35 CIDRs</text>
        <rect x="425" y="22" width="70" height="28" rx="6" fill="#1e293b"/>
        <text x="440" y="40" fill="#cbd5e1" font-size="11" class="font-sans">Copy RSC</text>
      </g>

      <!-- ITEM 4: GERMANY GEO-IP -->
      <g transform="translate(0, 320)">
        <rect width="510" height="74" rx="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1"/>
        <rect x="16" y="14" width="46" height="46" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="25" y="43" fill="#34d399" font-size="18">🇩🇪</text>
        <text x="74" y="32" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Germany (DE) Country Zone</text>
        <rect x="255" y="20" width="42" height="18" rx="4" fill="#1e293b"/>
        <text x="262" y="33" fill="#94a3b8" font-size="10" class="font-mono">ISO-DE</text>
        <text x="74" y="52" fill="#64748b" font-size="11" class="font-mono">IPv4: 8,420 CIDRs (Collapsed)</text>
        <rect x="425" y="22" width="70" height="28" rx="6" fill="#1e293b"/>
        <text x="440" y="40" fill="#cbd5e1" font-size="11" class="font-sans">Copy RSC</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: ROUTEROS SCRIPT CODE PREVIEW (width: 515) -->
    <g transform="translate(610, 190)">
      <!-- Editor Header -->
      <path d="M0 8a8 8 0 0 1 8-8h499a8 8 0 0 1 8 8v32H0z" fill="#0a0f18"/>
      <rect width="515" height="404" rx="10" fill="none" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="40" x2="515" y2="40" stroke="#1e293b" stroke-width="1"/>

      <!-- File Name Tab -->
      <rect x="12" y="8" width="165" height="24" rx="5" fill="#111827" stroke="#334155" stroke-width="0.8"/>
      <text x="22" y="24" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">cloudflare.rsc (v7)</text>

      <!-- Action Buttons -->
      <g transform="translate(325, 8)">
        <rect x="0" y="0" width="85" height="24" rx="5" fill="#0891b2" fill-opacity="0.3" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="12" y="16" fill="#22d3ee" font-size="11" font-weight="600" class="font-sans">📋 Copy RSC</text>
        <rect x="95" y="0" width="85" height="24" rx="5" fill="#1e293b"/>
        <text x="104" y="16" fill="#cbd5e1" font-size="11" class="font-sans">⬇ Download</text>
      </g>

      <!-- Code Editor Body -->
      <g transform="translate(18, 60)" class="font-mono" font-size="11.5">
        <!-- Line 1: Header Comment -->
        <text y="0" fill="#64748b"># PrefixList - MikroTik RouterOS v7 Kit</text>
        <text y="18" fill="#64748b"># Target: Cloudflare | Updated: 2026-10-01</text>
        <text y="36" fill="#64748b"># Author: Hossein Golshan (github.com/hgolshan)</text>

        <!-- Line 4: Safe Cleanup -->
        <text y="62" fill="#f43f5e">/ip firewall address-list</text>
        <text y="80" fill="#94a3b8"><tspan fill="#f43f5e">remove</tspan> [find list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> comment=<tspan fill="#22d3ee">"PrefixList"</tspan>]</text>

        <!-- Line 6: Add Entries -->
        <text y="106" fill="#94a3b8"><tspan fill="#10b981">add</tspan> list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> address=<tspan fill="#fbbf24">104.16.0.0/13</tspan> comment=<tspan fill="#22d3ee">"PrefixList"</tspan></text>
        <text y="126" fill="#94a3b8"><tspan fill="#10b981">add</tspan> list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> address=<tspan fill="#fbbf24">104.24.0.0/14</tspan> comment=<tspan fill="#22d3ee">"PrefixList"</tspan></text>
        <text y="146" fill="#94a3b8"><tspan fill="#10b981">add</tspan> list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> address=<tspan fill="#fbbf24">172.64.0.0/13</tspan> comment=<tspan fill="#22d3ee">"PrefixList"</tspan></text>
        <text y="166" fill="#94a3b8"><tspan fill="#10b981">add</tspan> list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> address=<tspan fill="#fbbf24">173.245.48.0/20</tspan> comment=<tspan fill="#22d3ee">"PrefixList"</tspan></text>

        <!-- Line 11: Policy-Based Routing Section -->
        <text y="196" fill="#64748b"># RouterOS v7 Policy-Based Routing (FIB Table)</text>
        <text y="214" fill="#a855f7">/routing table</text>
        <text y="232" fill="#94a3b8"><tspan fill="#10b981">add</tspan> name=<tspan fill="#38bdf8">"to_vpn"</tspan> fib comment=<tspan fill="#22d3ee">"PrefixList PBR"</tspan></text>

        <!-- Line 14: Mangle & FastTrack Bypass -->
        <text y="258" fill="#a855f7">/ip firewall mangle</text>
        <text y="276" fill="#94a3b8"><tspan fill="#10b981">add</tspan> chain=prerouting dst-address-list=<tspan fill="#38bdf8">"CLOUDFLARE"</tspan> \</text>
        <text y="294" fill="#94a3b8">    action=mark-connection new-connection-mark=<tspan fill="#22d3ee">conn_to_vpn</tspan></text>

        <!-- Line 17: FastTrack Warning Badge -->
        <text y="322" fill="#eab308"># ⚠️ FastTrack Exclusion: Placed before fasttrack-connection</text>
      </g>
    </g>

    <!-- BOTTOM STATUS BAR -->
    <g transform="translate(50, 608)">
      <path d="M0 0h1100v18a14 14 0 0 1-14 14H14A14 14 0 0 1 0 18z" fill="#090d15"/>
      <line x1="0" y1="0" x2="1100" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="25" cy="16" r="4" fill="#10b981"/>
      <text x="36" y="19" fill="#94a3b8" font-size="11" class="font-sans">Catalog Data: Synced via RIPEstat &amp; IPdeny</text>
      <text x="895" y="19" fill="#64748b" font-size="11" class="font-sans">Author: <tspan fill="#38bdf8">Hossein Golshan</tspan> (@hgolshan)</text>
    </g>
  </g>
</svg>
