name: Weekly PrefixList Sync

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-prefixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Live BGP Prefixes & Rebuild Address Lists
        run: npm run build:lists
        env:
          NODE_ENV: production

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/lists/
          if git diff --staged --quiet; then
            echo "No prefix changes detected this week."
          else
            git commit -m "chore(sync): automated weekly prefixlist refresh [skip ci]"
            git push origin main
          fi
